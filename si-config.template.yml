# ==============================================================================
# SI 프로젝트 설정 파일 템플릿
# ==============================================================================
# 이 파일을 .codex/si-config.yml 또는 .claude/si-config.yml 로 복사한 뒤, 프로젝트에 맞게 값을 채워주세요.
# /riskzero-si-pipeline --init 명령으로 자동 생성할 수도 있습니다.
# ==============================================================================

# ------------------------------------------------------------------------------
# 프로젝트 기본 정보
# ------------------------------------------------------------------------------
project:
  # 프로젝트 이름 (예: "MyProject", "안전관리시스템")
  name: ""
  # 프로젝트 README 경로 (프로젝트 전체 컨텍스트 파악용)
  readme: ""

# ------------------------------------------------------------------------------
# 소스 자료 경로
# 기획서, 퍼블리싱, DDL 등 구현에 필요한 입력 자료의 위치
# ------------------------------------------------------------------------------
sources:
  # 기획서/와이어프레임 디렉토리 (Figma export, PDF, 이미지 등)
  wireframe: ""
  # 퍼블리싱(HTML/CSS) 디렉토리 (마크업 개발자가 작업한 결과물)
  publishing: ""
  # DDL 파일 경로 (테이블 생성 SQL)
  ddl: ""
  # 샘플 코드 디렉토리 (AI가 참고할 기존 구현 예시)
  sample: ""

# ------------------------------------------------------------------------------
# 서버 설정
# 개발 서버 포트 및 API 베이스 URL
# ------------------------------------------------------------------------------
server:
  frontend:
    # 프론트엔드 개발 서버 포트 (프로젝트에 맞게 설정)
    port:
    # 프론트엔드 베이스 URL (프로젝트에 맞게 설정, 예: "http://localhost:3000")
    baseUrl: ""
  backend:
    # 백엔드 개발 서버 포트 (프로젝트에 맞게 설정)
    port:
    # 백엔드 API 베이스 URL (프로젝트에 맞게 설정, 예: "http://localhost:8080")
    baseUrl: ""

# ------------------------------------------------------------------------------
# 인증 설정
# 로그인 API 및 토큰 관리 방식
# ------------------------------------------------------------------------------
auth:
  # 인증 방식: jwt | session | cookie
  type: "jwt"
  # 로그인 API 엔드포인트 (예: "/api/auth/login")
  loginApi: ""
  # 로그인 요청 필드명 (예: { username: "userId", password: "userPw" })
  loginFields:
    username: "userId"
    password: "password"
  # 로그인 응답에서 토큰을 추출할 필드 경로 (예: "data.accessToken")
  tokenField: ""
  # 요청 헤더에 토큰을 실을 헤더명 (예: "Authorization")
  tokenHeader: "Authorization"
  # 토큰 접두사 (예: "Bearer ")
  tokenPrefix: "Bearer "

# ------------------------------------------------------------------------------
# 프론트엔드 설정
# ------------------------------------------------------------------------------
frontend:
  # 프론트엔드 프로젝트 루트 경로 (예: "./my-frontend")
  root: ""
  # 프레임워크: react | vue | angular | next
  framework: "react"
  # 빌드 명령어 (예: "npm run build", "yarn build")
  buildCmd: "npm run build"
  # 린트 명령어 (예: "npm run lint", "npx eslint .")
  lintCmd: "npm run lint"
  # 테스트 명령어 (예: "npm test", "npm run test:unit", "npx vitest run")
  testCmd: ""

  # 라우트 설정
  routes:
    # 메인 라우터 파일 경로 (예: "src/router/index.tsx")
    main: ""
    # 서브 라우터 파일 경로 (기능별 라우트 분리 시, 예: "src/router/adminRoutes.tsx")
    sub: ""

  # 페이지 파일 구조 패턴
  pages:
    # 페이지 파일 루트 디렉토리 (예: "src/pages")
    root: "src/pages"
    # 목록 페이지 파일명 패턴 (예: "{Domain}ListPage.tsx")
    listFile: "{Domain}ListPage.tsx"
    # 상세/등록 페이지 파일명 패턴 (예: "{Domain}DetailPage.tsx")
    detailPattern: "{Domain}DetailPage.tsx"
    # API 훅 파일명 패턴 (예: "use{Domain}Api.ts")
    apiPattern: "use{Domain}Api.ts"

  # 유효성 검증 방식: react-hook-form | formik | yup | zod | manual
  validation: ""

  # 파일 업로드 설정
  fileUpload:
    # 파일 업로드 컴포넌트명 (예: "FileUpload", "DropzoneArea")
    component: ""
    # 파일 업로드 관련 props 매핑
    props:
      # 허용 파일 형식 prop명 (예: "accept")
      accept: ""
      # 최대 파일 수 prop명 (예: "maxCnt")
      maxCount: ""
      # 최대 파일 크기 prop명 (예: "maxSize")
      maxSize: ""

  # 페이지네이션 설정
  pagination:
    # 페이지네이션 컴포넌트명 (예: "Pagination", "TablePagination")
    component: ""

  # 권한 체크 패턴 (예: "auth={{ anyOf: ['C_USER'] }}")
  auth:
    pattern: ""

  # 페이지/컴포넌트 디렉토리 구조 패턴
  # {domain}은 도메인명 플레이스홀더 (예: user, project, safety)
  structure:
    # 목록 페이지 패턴 (예: "pages/{group}/{domain}/index.tsx")
    listPage: ""
    # 상세 페이지 패턴 (예: "pages/{group}/{domain}/components/{Domain}Detail.tsx")
    detailPage: ""
    # API 훅 패턴 (예: "pages/{group}/{domain}/{Domain}Api.ts")
    api: ""

# ------------------------------------------------------------------------------
# 백엔드 설정
# ------------------------------------------------------------------------------
backend:
  # 백엔드 프로젝트 루트 경로 (예: "./my-backend")
  root: ""
  # 프레임워크: spring-boot | express | nestjs | django
  framework: "spring-boot"
  # 언어: java | kotlin | typescript | python
  language: "java"
  # 빌드 명령어 (예: "./gradlew build", "mvn package")
  buildCmd: ""
  # 테스트 명령어 (예: "./gradlew test", "mvn test")
  testCmd: ""
  # 소스 루트 경로 (예: "src/main/java")
  sourceRoot: "src/main/java"
  # 베이스 패키지 (예: "com.example.project")
  basePackage: ""

  # 패키지/디렉토리 구조 패턴
  # {domain}은 도메인명 플레이스홀더 (예: user, project, safety)
  structure:
    # Controller 패턴 (예: "api/{group}/{domain}/controller/{Domain}Controller.java")
    controller: ""
    # Service 패턴 (예: "api/{group}/{domain}/service/{Domain}Service.java")
    service: ""
    # Mapper/Repository 패턴 (예: "api/{group}/{domain}/mapper/{Domain}Mapper.java")
    mapper: ""
    # DTO 패턴 (예: "api/{group}/{domain}/model/dto/{Domain}SearchDto.java")
    dto: ""
    # VO/Entity 패턴 (예: "api/{group}/{domain}/model/vo/{Domain}VO.java")
    vo: ""
    # MyBatis XML 매퍼 패턴 (예: "resources/mapper/{group}/{domain}/{Domain}Mapper.xml")
    mapperXml: ""

  # 유효성 검증 어노테이션 목록 (프레임워크에서 사용하는 검증 어노테이션)
  validation:
    - "@NotNull"
    - "@NotBlank"
    - "@NotEmpty"
    - "@Size"
    - "@Min"
    - "@Max"
    - "@Pattern"
    - "@Email"
    - "@Valid"
    - "@Validated"

  # 권한 체크 패턴 (예: "@PreAuthorize(\"hasAuthority('R_XXX_LIST')\")")
  auth:
    pattern: ""

# ------------------------------------------------------------------------------
# 데이터베이스 설정
# ------------------------------------------------------------------------------
database:
  # DB 종류: postgresql | mysql | oracle | mssql
  type: "postgresql"
  # DDL 파일 경로 목록 (여러 파일 지정 가능)
  ddlPaths:
    - ""

# ------------------------------------------------------------------------------
# 산출물 경로 설정
# SI 파이프라인이 생성하는 영구 산출물의 저장 규칙
# ------------------------------------------------------------------------------
outputs:
  # 산출물 루트 디렉토리
  root: "plan"
  # 기능별 산출물 디렉토리 패턴. {feature}는 명령에 전달된 기능명으로 치환
  featureDirPattern: "{feature}"
  # 설계 전 논의 결정사항
  discussion: "discussion.md"
  # 계획 전 기술 리서치 결과. 스킵/무시 시 생성하지 않고 implementationPlan에 상태와 사유를 기록
  research: "research.md"
  # 구현 계획서
  implementationPlan: "implementation-plan.md"
  # 계획 단계에서 도출한 TDD 테스트 설계
  tddPlan: "tdd-plan.md"
  # 구현 단계의 RED/GREEN/REFACTOR 실행 증거
  tddReport: "tdd-report.md"
  # 계획 리뷰 결과
  planReview: "plan-review.md"
  # 프로젝트 표준 + 리서치/TDD 증거 코드 리뷰 결과
  codeReview: "code-review.md"
  # PR diff 안전성 리뷰 결과
  prReview: "pr-review.md"
  # QA 체크리스트
  qaChecklist: "qa-checklist.md"
  # QA 실행 리포트
  qaReport: "qa-report.md"
  # 최종 검증 리포트
  finalReport: "final-report.md"
  # 실행 증거 루트 디렉토리
  evidenceDir: "evidence"
  # 스크린샷 증거 디렉토리 (evidenceDir 기준 상대 경로)
  screenshotDir: "screenshots"
  # 로그 증거 디렉토리 (evidenceDir 기준 상대 경로)
  logsDir: "logs"
  # 테스트 결과 증거 디렉토리 (evidenceDir 기준 상대 경로)
  testResultsDir: "test-results"

# ------------------------------------------------------------------------------
# 계획/리서치 설정
# ------------------------------------------------------------------------------
planning:
  # auto: plan 진입 시 AI가 필요성을 판단하고 사용자에게 질문
  # always: 항상 research.md 작성
  # never: 리서치 없이 바로 계획 작성
  researchDefault: "auto"
  # auto: 리서치 진행 시 외부 공식 문서 확인 필요성을 AI가 판단하고 사용자에게 질문
  # always: 가능한 경우 공식 문서/표준/벤더 문서까지 확인
  # never: 외부 웹을 사용하지 않고 내부 README/샘플/기획/DDL만 사용
  externalResearchDefault: "auto"
  # official-first: 공식/표준/벤더 문서 우선, secondary 자료는 보조로만 사용
  # internal-only: 외부 웹을 열지 않고 내부 자료만 사용
  externalResearchSourcePolicy: "official-first"
  # true이면 외부 출처마다 URL, 문서명, 확인일, 적용 판단을 research.md에 기록
  requireResearchCitations: true
  # true이면 기존 research.md가 있을 때 사용/갱신/스킵 여부를 사용자에게 묻는다
  askWhenResearchExists: true

# ------------------------------------------------------------------------------
# 실행/오케스트레이션 설정
# ------------------------------------------------------------------------------
orchestration:
  # inline: 현재 에이전트가 순차 실행
  # subagents: 독립 리서치/리뷰/QA만 보조 에이전트에 위임
  # dynamic-workflow: Claude Code Dynamic Workflows 사용 가능 시 큰 작업에만 사용
  mode: "inline"
  # 단계별 사용자 확인 게이트는 항상 유지한다. subagent/Dynamic Workflow가 다음 단계로 직접 진행하지 못한다.
  requireUserGate: true
  # read-only 병렬 작업은 허용 가능. 쓰기 병렬화는 기본 금지.
  allowParallelReadOnly: true
  allowParallelWrites: false
  # auto이면 host(Codex/Claude Code)와 작업 크기에 따라 아래 추천을 참고하되,
  # 런타임이 지원하지 않으면 inline으로 fallback한다.
  modelRouting: "auto"
  # 단계별 추천 실행 주체. 실제 모델명은 각 런타임의 사용 가능 모델/플랜에 맞게 해석한다.
  stageRecommendations:
    "1-plan": "claude-opus-or-codex-high"
    "2-plan-review": "claude-opus-or-codex-review"
    "3-impl": "codex"
    "4-code-review": "codex-review-and-claude-opus"
    "5-pr-review": "codex-review"
    "6-qa-checklist": "claude-sonnet-or-codex"
    "7-qa-fix": "codex"
    "8-final-browse": "codex-or-gstack-browser"
  # Dynamic Workflows는 research preview 성격이므로 큰 변경/대규모 감사에만 자동 제안한다.
  dynamicWorkflowDefault: "ask" # ask / never / allowed
  # subagent 쓰기 정책. 기본은 read-only이고, 격리된 root에서만 쓰기를 고려한다.
  writePolicy:
    subagentDefault: "read-only"
    requireIsolatedRootsForParallelWrites: true
    sharedFilesRequireInlineOwner: true
    sharedFiles:
      - "routes"
      - "api-contract"
      - "tdd-report.md"
      - "qa-report.md"
      - "final-report.md"
  dynamicWorkflow:
    minUseCase: "large-read-only-research-or-audit"
    requireAskBeforeUse: true
    forbidByDefault:
      - "implementation-writes"
      - "qa-fix-writes"
      - "final-evidence-generation"

# ------------------------------------------------------------------------------
# 테스트/TDD 설정
# ------------------------------------------------------------------------------
testing:
  # 구현 단계에서 테스트 우선 RED-GREEN-REFACTOR 흐름을 요구할지 여부
  tddRequired: true
  # 구현 후 회귀 테스트 보강을 허용할지 여부. true여도 TDD 증거를 대체하지 않는다.
  regressionAfterAllowed: true
  # 리뷰 단계에서 tdd-report.md 증거를 필수로 볼지 여부
  evidenceRequired: true

# ------------------------------------------------------------------------------
# 더미 데이터 설정
# QA 및 테스트용 더미 데이터 생성 옵션
# ------------------------------------------------------------------------------
dummyData:
  # 더미 데이터 생성 건수 (예: 50)
  count: 20
  # 파일 업로드 API 경로 (더미 파일 첨부 시 사용, 예: "/api/file/upload")
  fileUploadApi: ""
  # 더미 데이터 제목/이름 접두사 (예: "[테스트]")
  prefix: "[테스트]"
